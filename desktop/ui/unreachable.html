<!doctype html>
<!--
  Shown when the app URL will not load: laptop offline, deployment down, or a URL
  with a typo in it. `main.js` navigates here from `did-fail-load` and passes the
  failed URL and Chromium's own description as query parameters.

  The point is that both fixes are one click away — retry for the transient case,
  change the URL for the permanent one — instead of a Chromium error page that
  offers neither.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FaceTimeOS — can't reach the app</title>
    <style>
      :root { color-scheme: dark }
      * { box-sizing: border-box }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background: #0b0b0f;
        color: #f4f4f5;
        font: 15px/1.55 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main { max-width: 30rem; text-align: center }
      h1 { font-size: 1.3rem; margin: 0 0 0.5rem }
      p { margin: 0 0 0.75rem; color: #a1a1aa; font-size: 0.9rem }
      code {
        display: block;
        margin: 0 0 1.25rem;
        padding: 0.6rem 0.7rem;
        border: 1px solid #2a2a36;
        border-radius: 0.5rem;
        background: #15151d;
        color: #e4e4e7;
        font-size: 0.8rem;
        word-break: break-all;
      }
      .row { display: flex; gap: 0.6rem; justify-content: center }
      button {
        font: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        padding: 0.55rem 1.1rem;
        border-radius: 0.5rem;
        border: 1px solid transparent;
        background: #6366f1;
        color: #fff;
        cursor: pointer;
      }
      button.ghost { background: transparent; border-color: #2a2a36; color: #f4f4f5 }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach FaceTimeOS</h1>
      <p id="reason">The app did not load.</p>
      <code id="url"></code>
      <div class="row">
        <button id="retry" type="button">Try again</button>
        <button id="change" type="button" class="ghost">Change server URL</button>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const failed = params.get('url') || '';
      const reason = params.get('reason') || '';

      // textContent, not innerHTML: both values come from whatever URL was being
      // loaded, which is not necessarily one this app chose.
      document.getElementById('url').textContent = failed;
      if (reason) {
        document.getElementById('reason').textContent =
          `The app did not load (${reason}). Check that you are online and that the address is right.`;
      }

      document.getElementById('retry').addEventListener('click', () => {
        window.facetimeosShell?.retry();
      });
      document.getElementById('change').addEventListener('click', () => {
        location.href = 'setup.html';
      });
    </script>
  </body>
</html>
